<div class="form-grid"><label>Nombre<input name="name" value="{{ current.name if current else '' }}" required maxlength="200"></label><label>Teléfono con código de país<input name="phone" value="{{ current.phone if current else '' }}" required maxlength="25"></label><label>Correo<input type="email" name="email" value="{{ current.email if current else '' }}" maxlength="200"></label><label>Origen<input name="source" value="{{ current.source if current else 'Manual' }}" required placeholder="WhatsApp, Instagram, Referido"></label><label>Etapa<select name="stage">{% for s in stages %}<option {{ 'selected' if current and current.stage==s }}>{{ s }}</option>{% endfor %}</select></label><label>Valor estimado<input type="number" name="value" value="{{ current.value if current else 0 }}" min="0" step="0.01"></label><label>Próximo seguimiento<input type="date" name="followup" value="{{ current.followup if current and current.followup else '' }}"></label><label>Responsable<select name="owner_id"><option value="">Sin asignar</option>{% for u in users if u.active %}<option value="{{ u.id }}" {{ 'selected' if current and current.owner_id==u.id }}>{{ u.name }}</option>{% endfor %}</select></label></div><label>Notas<textarea name="notes" maxlength="5000" rows="3">{{ current.notes if current else '' }}</textarea></label>
