<div class="form-grid"><label>Nombre<input name="name" value="{{ current.name if current else '' }}" required maxlength="200"></label><label>Especialidad / servicio<input name="specialty" value="{{ current.specialty if current else '' }}" required maxlength="200"></label><label>Correo<input type="email" name="email" value="{{ current.email if current else '' }}" required></label><label>Cuenta de Google<select name="account_id"><option value="">Solo local</option>{% for a in accounts %}<option value="{{ a.id }}" {{ 'selected' if current and current.account_id==a.id }}>{{ a.name }}</option>{% endfor %}</select></label><label>ID del calendario<input name="calendar_id" value="{{ current.calendar_id if current and current.calendar_id else '' }}" placeholder="correo@gmail.com o ID del calendario"></label></div>
